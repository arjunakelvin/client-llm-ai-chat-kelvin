  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: #0e1116; }
    /* Loading screen — ditampilkan sampai canvas Flutter terpasang.
       Mencegah layar putih/hitam kosong saat bundle belum selesai dimuat. */
    #pb-loading {
      position: fixed; inset: 0; z-index: 9999;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 18px;
      background: radial-gradient(circle at 50% 40%, #191f2e 0%, #0e1116 65%);
      color: #e8edf7; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      transition: opacity .35s ease;
    }
    #pb-loading.hide { opacity: 0; pointer-events: none; }
    #pb-loading img {
      width: 96px; height: 96px; border-radius: 24px;
      box-shadow: 0 16px 50px rgba(79,140,255,.28);
    }
    #pb-loading .pb-title { font-size: 16px; font-weight: 650; letter-spacing: .2px; }
    #pb-loading .pb-sub { font-size: 12px; color: #8b93a7; margin-top: -12px; }
    .pb-spinner {
      width: 26px; height: 26px; border-radius: 50%;
      border: 2.5px solid rgba(255,255,255,.14);
      border-top-color: #4f8cff;
      animation: pb-spin .8s linear infinite;
    }
    @keyframes pb-spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) {
      .pb-spinner { animation-duration: 2s; }
      #pb-loading { transition: none; }
    }
  </style>
</head>
<body>
  <div id="pb-loading" aria-label="Memuat PiercingBlow AI">
    <img src="icons/Icon-192.png" alt="PiercingBlow AI">
    <div class="pb-title">PiercingBlow AI</div>
    <div class="pb-sub">Menyiapkan model &amp; workspace…</div>
    <div class="pb-spinner"></div>
  </div>

  <script src="flutter_bootstrap.js" async></script>
  <script>
    // On some embedded/occluded windows the Flutter engine receives a
    // zero-sized surface during startup and never schedules the first frame,
    // leaving a blank page until the user resizes the window. Nudge the engine
    // with resize events until its canvas is attached. The same hook hides the
    // branded loading overlay once the first canvas exists.
    (function () {
      var attempts = 0;
      var running = false;
      var hidden = false;
      function hasCanvas() {
        var pane = document.querySelector('flt-glass-pane');
        return !!(pane && pane.shadowRoot &&
            pane.shadowRoot.querySelector('canvas'));
      }
      function hideLoader() {
        if (hidden) return;
        hidden = true;
        var el = document.getElementById('pb-loading');
        if (!el) return;
        el.classList.add('hide');
        setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 450);
      }
      function tick() {
        if (hasCanvas()) { hideLoader(); running = false; return; }
        if (attempts >= 600) { hideLoader(); running = false; return; }
        attempts++;
        window.dispatchEvent(new Event('resize'));
        setTimeout(tick, 500);
      }
      function kick() {
        if (running || hidden) return;
        running = true;
        attempts = 0;
        setTimeout(tick, 150);
      }
      window.addEventListener('focus', kick);
      document.addEventListener('visibilitychange', function () {
        if (document.visibilityState === 'visible') kick();
      });
      // Fallback: jangan pernah biarkan overlay menutupi UI selamanya.
      setTimeout(hideLoader, 10000);
      kick();
    })();
  </script>
</body>
